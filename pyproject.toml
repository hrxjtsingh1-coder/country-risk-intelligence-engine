[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "country-risk-intelligence-engine"
version = "0.2.0"
description = "Sovereign macro-risk intelligence system — transparent country-risk scoring from public macroeconomic data"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40,<2",
    "pandas>=2.1,<3",
    "numpy>=1.26,<3",
    "plotly>=5.20,<7",
    "PyYAML>=6.0,<7",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.4,<1",
    "mypy>=1.10,<2",
    "pandas-stubs>=2.1,<3",
]

[project.scripts]
risk-pipeline = "src.pipeline.run_all:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "BLE",  # flake8-blind-except
    "UP",   # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "BLE001", # blind except (used intentionally at fault boundaries)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests that hit external APIs (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
]
