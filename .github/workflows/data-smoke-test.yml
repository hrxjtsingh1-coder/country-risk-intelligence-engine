name: Official Data Smoke Test

on:
  push:
    branches: [main]
    paths:
      - "src/ingestion/**"
      - "config/data_sources.yaml"
      - ".github/workflows/data-smoke-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Test official provider APIs
        run: python -m src.ingestion.smoke_test
