name: Daily Data Refresh

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      countries:
        description: "Comma-separated ISO3 codes (leave empty for all)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e .

      - name: Run current-year live pipeline
        run: |
          ARGS="--start $(date -u +%Y) --end $(date -u +%Y) --skip-db"
          if [ -n "${{ github.event.inputs.countries }}" ]; then
            ARGS="$ARGS --countries ${{ github.event.inputs.countries }}"
          fi
          python -m src.pipeline.run_all $ARGS

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/processed/panel_wide.csv data/processed/data_metadata.json data/processed/manifest.json
          if git diff --cached --quiet; then
            echo "No current-year data changes to commit."
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "data: current-year daily refresh — $TIMESTAMP"
            git push
          fi
