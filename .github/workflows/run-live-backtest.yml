name: Run Live Backtest (1990-2025)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/run-live-backtest.yml"

permissions:
  contents: write

concurrency:
  group: live-backtest
  cancel-in-progress: false

jobs:
  fetch-and-score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e .

      - name: Run pipeline 1990-2025
        run: python -m src.pipeline.run_all --start 1990 --end 2025 --skip-db

      - name: Commit real data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/processed/panel_wide.csv data/processed/data_metadata.json data/processed/manifest.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "data: live backtest panel 1990-2025 — $TIMESTAMP"
            git push
          fi
