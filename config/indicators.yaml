indicators:
  - code: FP.CPI.TOTL.ZG
    label: Inflation
    category: Prices
    pillar: Monetary Stability
    weight: 0.16
    risk_direction: 1
    source: world_bank
    world_bank: FP.CPI.TOTL.ZG
    source_url: "https://data.worldbank.org/indicator/FP.CPI.TOTL.ZG"
    frequency: annual
    transformation: "Published annual percent change; no additional transformation."
    unit: "% YoY"
    note: "Annual consumer-price inflation, measuring the change in the CPI basket."
    min: -20
    max: 100

  - code: NY.GDP.MKTP.KD.ZG
    label: Real GDP growth
    category: Growth
    pillar: Macro Growth
    weight: 0.16
    risk_direction: -1
    source: world_bank
    world_bank: NY.GDP.MKTP.KD.ZG
    source_url: "https://data.worldbank.org/indicator/NY.GDP.MKTP.KD.ZG"
    frequency: annual
    transformation: "Published annual percent change; no additional transformation."
    unit: "% YoY"
    note: "Annual real GDP growth; stronger growth generally lowers macro risk."
    min: -40
    max: 30

  - code: SL.UEM.TOTL.ZS
    label: Unemployment
    category: Labor
    pillar: Macro Growth
    weight: 0.10
    risk_direction: 1
    source: world_bank
    world_bank: SL.UEM.TOTL.ZS
    source_url: "https://data.worldbank.org/indicator/SL.UEM.TOTL.ZS"
    frequency: annual
    transformation: "Published annual value; no additional transformation."
    unit: "% of labor force"
    note: "Share of the labor force without work but available for employment."
    min: 0
    max: 100

  - code: GC.DOD.TOTL.GD.ZS
    label: Public debt
    category: Fiscal
    pillar: Fiscal Sustainability
    weight: 0.18
    risk_direction: 1
    source: world_bank
    world_bank: GC.DOD.TOTL.GD.ZS
    source_url: "https://data.worldbank.org/indicator/GC.DOD.TOTL.GD.ZS"
    frequency: annual
    transformation: "Published annual value; no additional transformation."
    unit: "% of GDP"
    note: "General-government gross debt relative to the size of the economy."
    min: 0
    max: 500

  - code: BN.CAB.XOKA.GD.ZS
    label: Current account balance
    category: External
    pillar: External Vulnerability
    weight: 0.09
    risk_direction: -1
    source: world_bank
    world_bank: BN.CAB.XOKA.GD.ZS
    source_url: "https://data.worldbank.org/indicator/BN.CAB.XOKA.GD.ZS"
    frequency: annual
    transformation: "Published annual value; no additional transformation."
    unit: "% of GDP"
    note: "Current-account balance relative to GDP; deficits indicate external financing needs."
    min: -100
    max: 100

  - code: FI.RES.TOTL.MO
    label: FX reserves
    category: External
    pillar: External Vulnerability
    weight: 0.10
    risk_direction: -1
    source: world_bank
    world_bank: FI.RES.TOTL.MO
    source_url: "https://data.worldbank.org/indicator/FI.RES.TOTL.MO"
    frequency: annual
    transformation: "Published annual value; no additional transformation."
    unit: "months of imports"
    note: "Foreign-exchange reserves measured by the months of imports they can cover."
    min: 0
    max: 500

  - code: DT.DOD.DECT.GN.ZS
    label: External debt
    category: External
    pillar: External Vulnerability
    weight: 0.09
    risk_direction: 1
    source: world_bank
    world_bank: DT.DOD.DECT.GN.ZS
    source_url: "https://data.worldbank.org/indicator/DT.DOD.DECT.GN.ZS"
    frequency: annual
    transformation: "Published annual value; no additional transformation."
    unit: "% of GNI"
    note: "Total external debt stocks relative to gross national income."
    min: 0
    max: 1000

  - code: FB.AST.NPER.ZS
    label: Non-performing loans
    category: Banking
    pillar: Banking Health
    weight: 0.06
    risk_direction: 1
    source: world_bank
    world_bank: FB.AST.NPER.ZS
    source_url: "https://data.worldbank.org/indicator/FB.AST.NPER.ZS"
    frequency: annual
    transformation: "Published annual value; no additional transformation."
    unit: "% of gross loans"
    note: "Bank non-performing loans as a share of total gross loans."
    min: 0
    max: 100

  - code: FX_YOY_DEPRECIATION_PCT
    label: Currency depreciation
    category: FX
    pillar: External Vulnerability
    weight: 0.06
    risk_direction: 1
    source: derived
    source_url: "https://data.worldbank.org/indicator/PA.NUS.FCRF"
    source_series: PA.NUS.FCRF
    frequency: annual
    transformation: "Year-over-year percent change in official exchange rate (LCU per USD). Positive implies depreciation against USD."
    unit: "% YoY"
    note: "Year-over-year currency depreciation; positive values indicate a weaker currency."
    min: -100
    max: 500

  - code: POLICY_RATE_YOY_CHANGE_BPS
    label: Policy-rate change
    category: Monetary
    pillar: Monetary Stability
    weight: 0.00
    risk_direction: 1
    source: fred_us_only
    fred: DFF
    source_url: "https://fred.stlouisfed.org/series/DFF"
    source_series: DFF
    frequency: daily aggregated to annual mean
    transformation: "US-only: change in annual average Effective Federal Funds Rate, converted to basis points. It is not a globally comparable policy-rate signal."
    unit: "basis points YoY"
    note: "US-only enrichment. Change in annual-average Effective Federal Funds Rate, not a direct policy-rate level or a multi-country signal. Excluded from composite score."
    min: -1000
    max: 1000

  # IMF WEO indicators (supplementary — fills gaps where World Bank lags)
  - code: IMF_REAL_EFFECTIVE_EXCHANGE_RATE
    label: Real effective exchange rate
    category: FX
    pillar: External Vulnerability
    weight: 0.00
    risk_direction: 1
    source: imf_ifs
    imf_flow: IFS
    imf_indicator: EREER_IX
    source_url: "https://data.imf.org/?sk=4c2e81ca2f2599de495da2f36ad1d667"
    frequency: annual
    transformation: "Log change in real effective exchange rate index. Positive change = real appreciation (lower competitiveness, higher risk)."
    unit: "index, log change"
    note: "Supplementary FX indicator from IMF IFS. Not included in composite score until validated against World Bank FX depreciation."
    min: -100
    max: 100
