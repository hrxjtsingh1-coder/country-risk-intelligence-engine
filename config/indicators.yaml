# Risk-scoring methodology (Phase 4 spec).
#
# Every indicator below is traceable: it carries its source, transformation,
# unit, plausibility bounds, and the pillar + weight it feeds.

# ---------------------------------------------------------------------------
# Scoring method parameters
# ---------------------------------------------------------------------------
# Dual normalization: each indicator is z-scored TWO ways and blended:
#   - history_z : against the country's OWN history (the panel lookback window,
#                  nominally 10 years)
#   - peer_z    : against the country's PEER GROUP (advanced / emerging, from
#                  config/countries.yaml) in the same year
# The blend is configurable; a side missing too few observations is dropped and
# the remaining side carries the full weight rather than forcing garbage in.
scoring:
  history_z_weight: 0.5
  peer_z_weight: 0.5
  min_history_obs: 5      # minimum non-null own-history years for time-z to count
  min_peer_obs: 2         # minimum non-null members in a peer-year for peer-z to count
  trend_threshold_points: 1.5   # |1y score delta| below this renders as "stable"
  # Sector aggregate weight (0.0-1.0). The composite is a blend:
  #   composite = (1 - w) * pillar_weighted_composite + w * sector_score
  # At 0.0 the composite is purely pillar-driven (Phase 4 behavior); at 1.0 it
  # is purely sector-driven. The sector_score itself is a renormalized weighted
  # average of the pillar scores inside each configured sector.
  sector_composite_weight: 0.30
  # Trend deltas use the finest cadence the panel supports. The core series are
  # ANNUAL, so the scoring layer emits trend_1y_delta / trend_2y_delta. When
  # sub-annual indicators enter the panel (daily FX vol, monthly policy rates,
  # BIS quarterly credit), the same columns report 3-month / 12-month deltas.

# ---------------------------------------------------------------------------
# Sector weights (a sector is a "super-pillar" grouping of pillars; the sector
# score is the renormalized weighted average of its pillars' scores). Sector
# weights must sum to 1.0, every active pillar must belong to exactly one
# sector, and each sector must list at least one pillar.
# ---------------------------------------------------------------------------
sector_weights:
  Macro & Fiscal Sector: 0.55
  Financial & External Sector: 0.45

sectors:
  Macro & Fiscal Sector:
    - Macro Growth & Inflation
    - Fiscal Sustainability
  Financial & External Sector:
    - External Vulnerability
    - Monetary & Currency Stability
    - Banking & Financial Sector Health

# ---------------------------------------------------------------------------
# Pillar weights (must sum to 1.0). Each pillar is scored 0-100 from its own
# indicator set, then the overall composite is the weighted average of the
# pillars that actually have data for a country-year (weights renormalized over
# the pillars present). Political / Event Risk (GDELT) is reserved at 0.0 until
# a defensible source is wired in — when it is, renormalize these weights.
# ---------------------------------------------------------------------------
pillar_weights:
  Macro Growth & Inflation: 0.26
  Fiscal Sustainability: 0.22
  External Vulnerability: 0.20
  Monetary & Currency Stability: 0.16
  Banking & Financial Sector Health: 0.16

# ---------------------------------------------------------------------------
# Indicators. Pillar weights above set pillar-level influence; indicator
# weights below are RELATIVE to the other indicators in the same pillar (the
# pillar signal is renormalized over whatever is available that country-year).
# ---------------------------------------------------------------------------
indicators:
  # --- Macro Growth & Inflation -------------------------------------------------
  - code: FP.CPI.TOTL.ZG
    label: Inflation
    category: Prices
    pillar: Macro Growth & Inflation
    weight: 0.10
    risk_direction: 1
    source: world_bank
    world_bank: FP.CPI.TOTL.ZG
    source_url: "https://data.worldbank.org/indicator/FP.CPI.TOTL.ZG"
    frequency: annual
    transformation: "Published annual percent change; no additional transformation."
    unit: "% YoY"
    note: "Annual consumer-price inflation, measuring the change in the CPI basket."
    min: -20
    max: 100

  - code: NY.GDP.MKTP.KD.ZG
    label: Real GDP growth
    category: Growth
    pillar: Macro Growth & Inflation
    weight: 0.11
    risk_direction: -1
    source: world_bank
    world_bank: NY.GDP.MKTP.KD.ZG
    source_url: "https://data.worldbank.org/indicator/NY.GDP.MKTP.KD.ZG"
    frequency: annual
    transformation: "Published annual percent change; no additional transformation."
    unit: "% YoY"
    note: "Annual real GDP growth; stronger growth generally lowers macro risk."
    min: -40
    max: 30

  - code: SL.UEM.TOTL.ZS
    label: Unemployment
    category: Labor
    pillar: Macro Growth & Inflation
    weight: 0.03
    risk_direction: 1
    source: world_bank
    world_bank: SL.UEM.TOTL.ZS
    source_url: "https://data.worldbank.org/indicator/SL.UEM.TOTL.ZS"
    frequency: annual
    transformation: "Published annual value; no additional transformation."
    unit: "% of labor force"
    note: "Share of the labor force without work but available for employment."
    min: 0
    max: 100

  - code: OUTPUT_GAP_PROXY_PCT
    label: Output-gap proxy
    category: Growth
    pillar: Macro Growth & Inflation
    weight: 0.02
    risk_direction: -1
    source: derived
    source_url: "https://data.worldbank.org/indicator/NY.GDP.MKTP.KD.ZG"
    source_series: NY.GDP.MKTP.KD.ZG
    frequency: annual
    transformation: "Derived proxy: real GDP growth minus the trailing 3-year average of that country's real GDP growth. Positive = growing above recent trend (less slack); documented proxy, not an official output-gap estimate."
    unit: "pp of GDP"
    note: "Proxy for cyclical slack; premium on real growth versus its own recent trend."
    min: -40
    max: 40

  # --- Fiscal Sustainability ------------------------------------------------------
  - code: GC.DOD.TOTL.GD.ZS
    label: Public debt
    category: Fiscal
    pillar: Fiscal Sustainability
    weight: 0.14
    risk_direction: 1
    source: world_bank
    world_bank: GC.DOD.TOTL.GD.ZS
    source_url: "https://data.worldbank.org/indicator/GC.DOD.TOTL.GD.ZS"
    frequency: annual
    transformation: "Published annual value; no additional transformation."
    unit: "% of GDP"
    note: "General-government gross debt relative to the size of the economy."
    min: 0
    max: 500

  - code: GC.NLD.TOTL.GD.ZS
    label: Budget balance
    category: Fiscal
    pillar: Fiscal Sustainability
    weight: 0.05
    risk_direction: -1
    source: world_bank
    world_bank: GC.NLD.TOTL.GD.ZS
    source_url: "https://data.worldbank.org/indicator/GC.NLD.TOTL.GD.ZS"
    frequency: annual
    transformation: "Published annual net lending (+) / net borrowing (-) as % of GDP."
    unit: "% of GDP"
    note: "General-government net lending/borrowing; deficits indicate financing need."
    min: -100
    max: 100

  - code: PUBLIC_DEBT_TRAJECTORY_PCT
    label: Public-debt trajectory
    category: Fiscal
    pillar: Fiscal Sustainability
    weight: 0.03
    risk_direction: 1
    source: derived
    source_url: "https://data.worldbank.org/indicator/GC.DOD.TOTL.GD.ZS"
    source_series: GC.DOD.TOTL.GD.ZS
    frequency: annual
    transformation: "Derived: change in public-debt-to-GDP over the trailing 3 years. Positive = rising debt burden."
    unit: "pp of GDP (3y change)"
    note: "Debt trajectory, not just the debt stock; a fast-rising stock is the real signal."
    min: -500
    max: 500

  # --- External Vulnerability ------------------------------------------------------
  - code: BN.CAB.XOKA.GD.ZS
    label: Current account balance
    category: External
    pillar: External Vulnerability
    weight: 0.06
    risk_direction: -1
    source: world_bank
    world_bank: BN.CAB.XOKA.GD.ZS
    source_url: "https://data.worldbank.org/indicator/BN.CAB.XOKA.GD.ZS"
    frequency: annual
    transformation: "Published annual value; no additional transformation."
    unit: "% of GDP"
    note: "Current-account balance relative to GDP; deficits indicate external financing needs."
    min: -100
    max: 100

  - code: FI.RES.TOTL.MO
    label: FX reserves
    category: External
    pillar: External Vulnerability
    weight: 0.07
    risk_direction: -1
    source: world_bank
    world_bank: FI.RES.TOTL.MO
    source_url: "https://data.worldbank.org/indicator/FI.RES.TOTL.MO"
    frequency: annual
    transformation: "Published annual value; no additional transformation."
    unit: "months of imports"
    note: "Foreign-exchange reserves measured by the months of imports they can cover."
    min: 0
    max: 500

  - code: DT.DOD.DECT.GN.ZS
    label: External debt
    category: External
    pillar: External Vulnerability
    weight: 0.05
    risk_direction: 1
    source: world_bank
    world_bank: DT.DOD.DECT.GN.ZS
    source_url: "https://data.worldbank.org/indicator/DT.DOD.DECT.GN.ZS"
    frequency: annual
    transformation: "Published annual value; no additional transformation."
    unit: "% of GNI"
    note: "Total external debt stocks relative to gross national income."
    min: 0
    max: 1000

  - code: NE.RSB.GNFS.ZS
    label: Trade balance
    category: External
    pillar: External Vulnerability
    weight: 0.02
    risk_direction: -1
    source: world_bank
    world_bank: NE.RSB.GNFS.ZS
    source_url: "https://data.worldbank.org/indicator/NE.RSB.GNFS.ZS"
    frequency: annual
    transformation: "Published external balance on goods and services as % of GDP."
    unit: "% of GDP"
    note: "Trade balance on goods and services; deficits raise external financing needs."
    min: -100
    max: 100

  # --- Monetary & Currency Stability -----------------------------------------------
  - code: FX_YOY_DEPRECIATION_PCT
    label: Currency depreciation
    category: FX
    pillar: Monetary & Currency Stability
    weight: 0.10
    risk_direction: 1
    source: derived
    source_url: "https://data.worldbank.org/indicator/PA.NUS.FCRF"
    source_series: PA.NUS.FCRF
    frequency: annual
    transformation: "Year-over-year percent change in official exchange rate (LCU per USD). Positive implies depreciation against USD."
    unit: "% YoY"
    note: "Year-over-year currency depreciation; positive values indicate a weaker currency."
    min: -100
    max: 500

  # Supplementary monetary indicators (reserved, zero weight until globally
  # comparable series are validated for all configured countries):
  - code: POLICY_RATE_YOY_CHANGE_BPS
    label: Policy-rate change
    category: Monetary
    pillar: Monetary & Currency Stability
    weight: 0.00
    risk_direction: 1
    source: fred_us_only
    fred: DFF
    source_url: "https://fred.stlouisfed.org/series/DFF"
    source_series: DFF
    frequency: daily aggregated to annual mean
    transformation: "US-only: change in annual average Effective Federal Funds Rate, converted to basis points. It is not a globally comparable policy-rate signal."
    unit: "basis points YoY"
    note: "US-only enrichment. Change in annual-average Effective Federal Funds Rate, not a direct policy-rate level or a multi-country signal. Excluded from composite score."
    min: -1000
    max: 1000

  - code: IMF_REAL_EFFECTIVE_EXCHANGE_RATE
    label: Real effective exchange rate
    category: FX
    pillar: Monetary & Currency Stability
    weight: 0.00
    risk_direction: 1
    source: imf_ifs
    imf_flow: IFS
    imf_indicator: EREER_IX
    source_url: "https://data.imf.org/?sk=4c2e81ca2f2599de495da2f36ad1d667"
    frequency: annual
    transformation: "Log change in real effective exchange rate index. Positive change = real appreciation (lower competitiveness, higher risk)."
    unit: "index, log change"
    note: "Supplementary FX indicator from IMF IFS. Not included in composite score until validated against World Bank FX depreciation."
    min: -100
    max: 100

  # --- Banking & Financial Sector Health --------------------------------------------
  - code: FB.AST.NPER.ZS
    label: Non-performing loans
    category: Banking
    pillar: Banking & Financial Sector Health
    weight: 0.10
    risk_direction: 1
    source: world_bank
    world_bank: FB.AST.NPER.ZS
    source_url: "https://data.worldbank.org/indicator/FB.AST.NPER.ZS"
    frequency: annual
    transformation: "Published annual value; no additional transformation."
    unit: "% of gross loans"
    note: "Bank non-performing loans as a share of total gross loans."
    min: 0
    max: 100

  - code: BIS_CREDIT_GAP
    label: Credit-to-GDP gap
    category: Banking
    pillar: Banking & Financial Sector Health
    weight: 0.00
    risk_direction: 1
    source: bis
    source_url: "https://www.bis.org/statistics/credit_gap.htm"
    source_url_api: "https://stats.bis.org/en/Page?page=help/sdmx_rest2"
    frequency: quarterly
    transformation: "BIS credit-to-GDP gap (deviation of credit/GDP from its one-sided HP-filtered long-run trend), drawn from the WS_CREDIT_GAP SDMX dataflow (key Q.<ISO2>.P.A.C) and annualized to the year-end (Q4) observation. Positive = credit overheating."
    unit: "pp of GDP"
    note: "Shock driver for the banking-stress preset. Weight 0.00 reserved: it stays out of the composite score so methodology and backtest results remain unchanged; it drives the scenario, it is not a scored input."
    min: -100
    max: 200

  # Shock-driver series (reserved, zero weight until they are scored as well).
  # COMMODITY_PRICE_INDEX_PCT is the global all-commodities price index from
  # FRED/IMF, used by the commodity-collapse preset as a country-agnostic swing.
  - code: COMMODITY_PRICE_INDEX_PCT
    label: Commodity-price index (global)
    category: Terms of trade
    pillar: External Vulnerability
    weight: 0.00
    risk_direction: 1
    source: fred_global
    fred: PALLFNFINDEXM
    source_url: "https://fred.stlouisfed.org/series/PALLFNFINDEXM"
    source_series: PALLFNFINDEXM
    frequency: monthly aggregated to annual mean
    transformation: "Global Price Index of All Commodities (index 2016=100), annual mean of monthly observations, then year-over-year percent change. Identical across countries in a given year."
    unit: "% YoY"
    note: "Shock driver for the commodity-collapse preset (exporters' terms-of-trade swing). Weight 0.00 reserved: it stays out of the composite score so methodology and backtest results remain unchanged; it drives the scenario, it is not a scored input. Positive = prices rising."
    min: -100
    max: 100