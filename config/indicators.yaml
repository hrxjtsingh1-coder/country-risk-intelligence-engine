indicators:
  - code: FP.CPI.TOTL.ZG
    label: Inflation
    category: Prices
    weight: 0.16
    risk_direction: 1
    source: world_bank
    world_bank: FP.CPI.TOTL.ZG
    unit: "% YoY"
    note: "Annual consumer-price inflation, measuring the change in the CPI basket."
    min: -20
    max: 100

  - code: NY.GDP.MKTP.KD.ZG
    label: Real GDP growth
    category: Growth
    weight: 0.16
    risk_direction: -1
    source: world_bank
    world_bank: NY.GDP.MKTP.KD.ZG
    unit: "% YoY"
    note: "Annual real GDP growth; stronger growth generally lowers macro risk."
    min: -40
    max: 30

  - code: SL.UEM.TOTL.ZS
    label: Unemployment
    category: Labor
    weight: 0.10
    risk_direction: 1
    source: world_bank
    world_bank: SL.UEM.TOTL.ZS
    unit: "% of labor force"
    note: "Share of the labor force without work but available for employment."
    min: 0
    max: 100

  - code: GC.DOD.TOTL.GD.ZS
    label: Public debt
    category: Fiscal
    weight: 0.14
    risk_direction: 1
    source: world_bank
    world_bank: GC.DOD.TOTL.GD.ZS
    unit: "% of GDP"
    note: "General-government gross debt relative to the size of the economy."
    min: 0
    max: 500

  - code: BN.CAB.XOKA.GD.ZS
    label: Current account balance
    category: External
    weight: 0.09
    risk_direction: -1
    source: world_bank
    world_bank: BN.CAB.XOKA.GD.ZS
    unit: "% of GDP"
    note: "Current-account balance relative to GDP; deficits indicate external financing needs."
    min: -100
    max: 100

  - code: FI.RES.TOTL.MO
    label: FX reserves
    category: External
    weight: 0.10
    risk_direction: -1
    source: world_bank
    world_bank: FI.RES.TOTL.MO
    unit: "months of imports"
    note: "Foreign-exchange reserves measured by the months of imports they can cover."
    min: 0
    max: 500

  - code: DT.DOD.DECT.GN.ZS
    label: External debt
    category: External
    weight: 0.09
    risk_direction: 1
    source: world_bank
    world_bank: DT.DOD.DECT.GN.ZS
    unit: "% of GNI"
    note: "Total external debt stocks relative to gross national income."
    min: 0
    max: 1000

  - code: FB.AST.NPER.ZS
    label: Non-performing loans
    category: Banking
    weight: 0.06
    risk_direction: 1
    source: world_bank
    world_bank: FB.AST.NPER.ZS
    unit: "% of gross loans"
    note: "Bank non-performing loans as a share of total gross loans."
    min: 0
    max: 100

  - code: FX_YOY_DEPRECIATION_PCT
    label: Currency depreciation
    category: FX
    weight: 0.06
    risk_direction: 1
    source: derived
    unit: "% YoY"
    note: "Year-over-year currency depreciation; positive values indicate a weaker currency."
    min: -100
    max: 500

  - code: POLICY_RATE_YOY_CHANGE_BPS
    label: Policy-rate change
    category: Monetary
    weight: 0.04
    risk_direction: 1
    source: fred
    fred: DFF
    unit: "basis points YoY"
    note: "Year-over-year change in the policy rate; positive values indicate tightening."
    min: -1000
    max: 1000

  # Optional source placeholders. If an external endpoint is unavailable,
  # the collector leaves them missing instead of inventing observations.
  - code: BIS_CREDIT_GAP
    label: Credit-to-GDP gap
    category: Credit
    weight: 0.00
    risk_direction: 1
    source: bis
    unit: "percentage points"
    note: "Credit-to-GDP gap relative to its long-term trend."
    min: -100
    max: 100
